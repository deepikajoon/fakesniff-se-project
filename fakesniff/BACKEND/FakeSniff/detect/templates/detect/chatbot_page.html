{% extends 'detect/base1.html' %}
{% load static %}

{% block content %}
<div class="container-fluid vh-100 overflow-hidden">
  <div class="row h-100">

    <!-- Sidebar -->
    <div class="col-md-2 bg-white d-flex flex-column align-items-center justify-content-start p-2">
      <a class="navbar-brand mb-2" href="#">
        <img src="{% static 'images/fingerprint.png' %}" alt="Fingerprint Icon" style="width: 120px;">
      </a>
      <h4 class="fw-bold text-center mb-3">FAKE SNIFF</h4>
      <nav class="nav flex-column text-center">
                <a class="nav-link options" href="{% url 'user_dashboard' %}">Dashboard</a>
                <a class="nav-link options" href="#">My Vault</a>
                <a class="nav-link options" href="#">Detect</a>
                <a class="nav-link options" href="#">Report</a>
                <a class="nav-link options" href="{% url 'feedback_page' %}">Feedback</a>
                <a class="nav-link options" href="{% url 'chatbot_page' %}">Chatbot</a>
                <a class="nav-link options" href="#">Help</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 d-flex flex-column align-items-center p-3">

      <!-- Top Bar -->
      <div class="row w-100 mb-3">
        <div class="col-auto ms-auto">
          <a class="nav-link options text-white" href="{% url 'landing_page' %}">Log Out</a>
        </div>
      </div>

      <!-- Chatbot Area -->
        <div style="text-align: left;">
            <h2 style="color: whitesmoke; font-size: 45px;margin: 0;">AI Assistant</h2>
            <h3 style="color: whitesmoke; font-size: 35;">Ask me about FakeSniff</h3>
            <h4 style="color: whitesmoke; font-size: 25px;">Hello! I'm the fake sniff Al assistant. How can i help you today?</h4>
            <h5 style="color: whitesmoke; font-size: 15px;">Quick Questions</h5>
        </div>
        <div class="row">
            <div class="col-md-12 text-center mt-3">
                <button class="btn btn-others">How to upload a media for verification?</button>
                <button class="btn btn-others">How to view my report?</button>
            </div>
            <div class="col-md-12 text-center mt-3">
                <button class="btn btn-others">How accurate is the AI verification?</button>
                <button class="btn btn-others">Can I generate report?</button>
            </div>
        </div>
        <div class="row-w-100">
            <div class="col text-center">
                <textarea class="form-control mt-4" rows=1 cols=110 placeholder="Type your message here..."></textarea>
            </div>
            <div class="col text-center mt-3">
                <button class="btn btn-others mt-2">Send</button>
            </div>
        </div>
    </div>
  </div>
</div>
{% endblock %}
